# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gambit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CRAFT_DISABLE
        value: "1"
      - key: STAKE_USE_BROWSER
        value: "false"
      - key: STAKE_BROWSER_WARMUP_ON_STARTUP
        value: "false"
      - key: STAKE_ODDS_LOOP_SECONDS
        value: "600"
      - key: GAMBIT_REPO
        value: abhyvx/Gambit
      - key: STAKE_RELAY_SECRET
        value: gambit-relay-v1-abhyvx
      # Optional cloud Chrome (Browserbase) — 24/7 Stake odds + Portfolio Connect.
      # Set in Render dashboard (do not commit secrets):
      #   BROWSERBASE_API_KEY
      #   BROWSERBASE_PROJECT_ID
