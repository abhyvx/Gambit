# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gambit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CRAFT_DISABLE
        value: "1"
      - key: STAKE_USE_BROWSER
        value: "false"
      - key: STAKE_BROWSER_WARMUP_ON_STARTUP
        value: "false"
      - key: STAKE_ODDS_LOOP_SECONDS
        value: "600"
      - key: GAMBIT_REPO
        value: abhyvx/Gambit
      # Set in Render dashboard (do not commit secrets):
      #   DATABASE_URL + TURSO_AUTH_TOKEN   — persistent users/sessions/portfolios
      #   GAMBIT_SECRETS_KEY                — encrypt per-user Stake tokens
      #   GAMBIT_ADMIN_EMAILS               — comma-separated admin emails
      #   CORS_ORIGINS                      — e.g. https://gambit-xxxx.onrender.com
      #   BROWSERBASE_API_KEY               — remote Chrome for live Stake (no laptop popups)
      #   ODDS_API_KEY                      — optional live book odds
      #   STAKE_RELAY_SECRET                — optional legacy laptop relay only
