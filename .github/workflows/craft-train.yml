# Free background craft training — does not run on your laptop.
# Artifacts: craft.db + model_params + NN weights (download and copy to ~/.bet_placer on deploy).
name: Craft training

on:
  schedule:
    - cron: "0 0 * * *"  # daily midnight UTC (~24h cadence)
  workflow_dispatch:
    inputs:
      epochs:
        description: Max craft epochs
        default: "15"
      full_model:
        description: Full model retrain first (slow)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Bootstrap published model state
        env:
          GAMBIT_REPO: abhyvx/Gambit
        run: bash scripts/bootstrap_model.sh

      - name: Craft worker
        id: craft
        continue-on-error: true
        env:
          CRAFT_DISABLE: "1"
        run: |
          mkdir -p "$HOME/.bet_placer"
          FLAGS="--epochs ${{ inputs.epochs || 15 }}"
          if [ "${{ inputs.full_model }}" = "true" ]; then FLAGS="$FLAGS --full-model"; fi
          if ! PYTHONPATH=src python3 - <<'PY'
from bet_placer.ml.params import load_params
p = load_params(force=True)
ok = bool(
    int(p.get("trained_on") or 0)
    or int(p.get("trained_on_history") or 0)
    or any(int(v or 0) > 0 for v in ((p.get("trained_on_sport_history") or {}).values()))
    or any((p.get("elo_by_sport") or {}).values())
)
raise SystemExit(0 if ok else 1)
PY
          then
            FLAGS="$FLAGS --full-model"
          fi
          PYTHONPATH=src python3 scripts/run_craft_worker.py $FLAGS
          PYTHONPATH=src python3 scripts/rebuild_depth.py --quiet
          PYTHONPATH=src python3 scripts/check_model_insights_desk.py
          PYTHONPATH=src python3 -c "from bet_placer.ml.betting_evolution import rebuild_from_corpora; print(rebuild_from_corpora(verbose=True))"

      - name: Upload model state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bet-placer-model-state
          path: |
            ~/.bet_placer/craft.db
            ~/.bet_placer/model_params.json
            ~/.bet_placer/craft_nn.joblib
            ~/.bet_placer/betting_evolution.db
            ~/.bet_placer/factor_store.json
            ~/.bet_placer/model_insights_cache.json
          retention-days: 14

      - name: Stage model files
        if: always()
        run: |
          mkdir -p model-out
          for f in craft.db model_params.json craft_nn.joblib betting_evolution.db factor_store.json model_insights_cache.json; do
            [ -f "$HOME/.bet_placer/$f" ] && cp "$HOME/.bet_placer/$f" "model-out/$f"
          done
          ls -la model-out || true

      - name: Publish model release (cloud deploy pulls this)
        if: always()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: model-latest
          name: Gambit model state
          body: Auto-published by craft-train workflow
          files: model-out/*
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
