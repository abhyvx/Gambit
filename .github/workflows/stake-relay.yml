# Push live Stake odds to Render every 15 minutes (free, no laptop).
name: Stake relay

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + Playwright
        run: |
          pip install -e .
          playwright install chromium
          playwright install-deps chromium

      - name: Push Stake overlay to cloud app
        env:
          STAKE_USE_BROWSER: "true"
          STAKE_RELAY_SECRET: gambit-relay-v1-abhyvx
          GAMBIT_CLOUD_URL: ${{ vars.GAMBIT_CLOUD_URL }}
        run: |
          URL="${GAMBIT_CLOUD_URL:-}"
          if [ -z "$URL" ] && [ -f deploy/cloud_url.txt ]; then
            URL=$(grep -E '^https://' deploy/cloud_url.txt | head -1)
          fi
          if [ -z "$URL" ] || echo "$URL" | grep -q YOUR-SERVICE; then
            echo "Set GitHub repo variable GAMBIT_CLOUD_URL or edit deploy/cloud_url.txt"
            exit 0
          fi
          export GAMBIT_CLOUD_URL="$URL"
          PYTHONPATH=src python3 scripts/stake_relay_once.py
